# System-width configuration for plugin
enabled = 1

# -------------------------------------------------------
# Editor.js — outils personnalisés IdéesCulture
#
# Active (1) / désactive (0) les blocs Editor.js spécifiques affichés dans
# l'éditeur d'article. Valeurs par défaut ci-dessous (activé par défaut).
#
# Surcharge par instance : créez conf/local/articles.conf et n'y indiquez que
# les clés à changer (les clés absentes retombent sur les valeurs ci-dessous,
# une clé totalement absente = activée).
#
# Note : simpleCollectageVideo nécessite que le JS
# lib/ideesculture-editorjs-collectage-video/simple-collectage-video.js soit
# présent ; il n'est pas fourni avec le plugin.
# -------------------------------------------------------
editorjs_ideesculture_tools = {
	simpleimage = 1,
	simpleaudio = 1,
	simplevideo = 1,
	simpleAlbum = 1,
	# Désactivé par défaut : le JS n'est PAS fourni avec le plugin
	# (lib/ideesculture-editorjs-collectage-video/ est vide). N'activez ce bloc
	# que si vous fournissez simple-collectage-video.js, sinon l'éditeur plante.
	simpleCollectageVideo = 0,
	simpleMorceau = 1,
	caObject = 1,
	caOccurrence = 1,
	caSet = 1
}

# -------------------------------------------------------
# Bloc « CA Object » — gabarit d'affichage enrichi.
#
# Les codes de champs (templates getWithTemplate) varient selon l'instance
# CollectiveAccess : adaptez-les ici (ou dans conf/local/articles.conf).
# Chaque entrée de ca_object_field_templates est rendue via getWithTemplate ;
# les valeurs vides sont ignorées. Pas de virgule dans un template.
# -------------------------------------------------------
ca_object_title_template = ^ca_objects.preferred_labels
ca_object_image_template = ^ca_object_representations.media.preview170.url
ca_object_field_templates = [
	^ca_objects.type_id,
	^ca_objects.idno,
	^ca_objects.campagnes_construction,
	^ca_objects.mission_interet_strategique
]

# -------------------------------------------------------
# Bloc « CA Occurrence » — même gabarit configurable.
# -------------------------------------------------------
ca_occurrence_title_template = ^ca_occurrences.preferred_labels
ca_occurrence_image_template = ^ca_object_representations.media.preview170.url
ca_occurrence_field_templates = [
	^ca_occurrences.type_id
]

# -------------------------------------------------------
# Versioning des articles
#
# Avant chaque enregistrement en base, le JSON des blocs est snapshoté dans un
# répertoire (persistant). On conserve les N dernières versions par article,
# pour pouvoir restaurer un contenu perdu.
#   article_versions_dir  : répertoire de stockage
#                           (vide => <plugins>/Articles/backup)
#   article_versions_keep : nombre de versions conservées par article
# -------------------------------------------------------
article_versions_dir =
article_versions_keep = 25

# -------------------------------------------------------
# Versioning des articles
#
# Avant chaque enregistrement en base, le JSON des blocs est snapshoté dans un
# répertoire. On conserve les N dernières versions par article (pour pouvoir
# restaurer un contenu perdu).
#   article_versions_dir  : répertoire de stockage (vide => <app>/tmp/article_versions)
#   article_versions_keep : nombre de versions conservées par article
# -------------------------------------------------------
article_versions_dir =
article_versions_keep = 25
